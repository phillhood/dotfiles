onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
surface_dim = "#3a3d52"
active_row_bg = "#3a3d52"

[keys]
prefix = "ctrl+s"
toggle_sidebar = ["prefix+b", "ctrl+backtick"]
split_vertical = ["prefix+v", "shift+alt+d"]
split_horizontal = ["prefix+minus", "shift+alt+s"]
close_pane = "prefix+x"
cycle_pane_next = ["prefix+tab", "shift+alt+e"]
previous_workspace = "shift+alt+u"
next_workspace = "shift+alt+i"
previous_agent = "shift+alt+j"
next_agent = "shift+alt+k"
switch_workspace = "prefix+shift+1..9"
switch_tab = ["prefix+1..9", "shift+alt+1..9"]
next_tab = ["prefix+n", "shift+alt+m"]
previous_tab = ["prefix+p", "shift+alt+n"]
new_tab = ["prefix+c", "shift+alt+t"]
resize_pane_left = "shift+alt+left"
resize_pane_down = "shift+alt+down"
resize_pane_up = "shift+alt+up"
resize_pane_right = "shift+alt+right"
swap_pane_left = "ctrl+shift+alt+left"
swap_pane_down = "ctrl+shift+alt+down"
swap_pane_up = "ctrl+shift+alt+up"
swap_pane_right = "ctrl+shift+alt+right"

# shift+alt+w closes the pane via a confirmation popup instead of the raw action
[[keys.command]]
key = "shift+alt+w"
type = "popup"
command = "/home/phill/.local/bin/herdr-confirm-close-pane"
description = "close pane (confirm)"
width = 64
height = 9

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
sidebar_width = 20
accent = "#c6a0f6"
prompt_new_tab_name = false
status_indicators = "dots"

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", fg = "#c6a0f6", bold = true }],
  [{ token = "$worktree", fg = "#8bd5ca" }],
  [{ token = "terminal_title_stripped", fg = "#cad3f5" }],
  [{ token = "agent", dim = true }],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", fg = "#c6a0f6", bold = true }],
  [{ token = "branch", fg = "#cad3f5" }, { token = "git_status", dim = true }],
]

[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"
