onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
surface_dim = "#3a3d52"

[keys]
prefix = "ctrl+s"
toggle_sidebar = "ctrl+backtick"
split_vertical = "shift+alt+d"
split_horizontal = "shift+alt+s"
close_pane = "prefix+x"
cycle_pane_next = ["prefix+tab", "shift+alt+e"]
previous_workspace = "shift+alt+k"
next_workspace = "shift+alt+j"
previous_agent = "shift+alt+q"
next_agent = "shift+alt+a"
switch_workspace = "prefix+shift+1..9"
switch_tab = ["prefix+1..9", "shift+alt+1..9"]
next_tab = ["prefix+n", "shift+alt+r"]
previous_tab = ["prefix+p", "shift+alt+f"]
new_tab = ["prefix+c", "shift+alt+t"]

# shift+alt+w closes the pane via a confirmation popup instead of the raw action
[[keys.command]]
key = "shift+alt+w"
type = "popup"
command = "/home/phill/.local/bin/herdr-confirm-close-pane"
description = "close pane (confirm)"
width = 64
height = 9

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
sidebar_width = 20
accent = "#c6a0f6"
prompt_new_tab_name = false

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", fg = "#c6a0f6", bold = true }, { token = "tab", dim = true }],
  [{ token = "terminal_title_stripped", fg = "#cad3f5" }],
  [{ token = "agent", dim = true }],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", fg = "#c6a0f6", bold = true }],
  [{ token = "branch", fg = "#cad3f5" }, { token = "git_status", dim = true }],
]

[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"
